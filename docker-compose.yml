# Pre-create the external network once on your NAS:
#   docker network create hopper-net
# This avoids Docker recreating the bridge on every up/down cycle,
# which can briefly disrupt host networking on some NAS devices.

services:
  bot:
    image: udidg/hopper-shopper-bot:latest
    env_file: .env
    networks:
      - hopper-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Give the old container time to cleanly close its Telegram polling
    # session before Docker kills it — prevents 409 Conflict on restart.
    stop_grace_period: 15s
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m

  db:
    image: postgres:16-alpine
    networks:
      - hopper-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-hopper_shopper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-hopper}
      interval: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  # Local LLM fallback — only starts with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    networks:
      - hopper-net
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    mem_limit: 2g

volumes:
  pgdata:
  ollama_data:

networks:
  hopper-net:
    external: true
