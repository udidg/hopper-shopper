services:
  bot:
    image: udidg/hopper-shopper-bot:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-hopper_shopper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to expose DB port on host (not needed for bot-only setup)
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-hopper}
      interval: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Ollama for smart department classification
  # Activate with: docker compose --profile llm up
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles: [llm]
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
