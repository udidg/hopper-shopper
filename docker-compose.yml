# Network is managed by Compose with a pinned subnet in the safe 172.x range.
# This prevents Docker from auto-assigning a 192.168.x.x subnet that could
# overlap with your LAN and cause routing issues / internet drops.
#
# MIGRATION: If you previously used an external "hopper-net", clean up:
#   docker compose down
#   docker network rm hopper-net          # remove the old external network
#   docker network rm hopper-shopper_hopper-net  # remove any stale auto-created one
#   docker compose up -d                  # Compose creates the new pinned network

services:
  bot:
    image: udidg/hopper-shopper-bot:latest
    env_file: .env
    networks:
      - hopper-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Give the old container time to cleanly close its Telegram polling
    # session before Docker kills it — prevents 409 Conflict on restart.
    stop_grace_period: 15s
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m

  db:
    image: postgres:16-alpine
    networks:
      - hopper-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-hopper_shopper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-hopper}
      interval: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  # Local LLM fallback — only starts with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    networks:
      - hopper-net
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    mem_limit: 2g

volumes:
  pgdata:
  ollama_data:

networks:
  hopper-net:
    driver: bridge
    ipam:
      config:
        # Pinned to 172.28.0.0/24 — safely in Docker's private range,
        # well away from typical LAN subnets (192.168.x.x, 10.x.x.x).
        # /24 = 254 usable addresses, more than enough for this stack.
        - subnet: 172.28.0.0/24
